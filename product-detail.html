<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - Montgomery Arms</title>
    <style>
        :root {
            --bg-main: #0b0e14; --bg-card: #121824; --bg-panel: #1a2130;
            --gold-accent: #dfb260; --gold-hover: #f3c272;
            --orange-btn: #e67e22; --orange-hover: #d35400;
            --text-light: #f4f5f7; --text-muted: #9ca3af;
            --border-subtle: rgba(223, 178, 96, 0.25);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-light); }

        header { background-color: #080a0f; border-bottom: 1px solid var(--border-subtle); padding: 12px 30px; display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap; }
        .logo { font-size: 1.3rem; font-weight: 800; color: var(--gold-accent); text-decoration: none; letter-spacing: 2px; white-space: nowrap; }
        .header-right { display: flex; align-items: center; gap: 20px; }
        nav { display: flex; gap: 20px; }
        nav a { color: var(--text-light); text-decoration: none; font-size: 0.75rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; transition: color 0.2s; }
        nav a:hover { color: var(--gold-accent); }
        .cart-btn { border: 1px solid var(--border-subtle); background-color: var(--bg-card); color: var(--text-light); padding: 8px 12px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; gap: 6px; text-decoration: none; font-size: 0.8rem; font-weight: 700; letter-spacing: 1px; }
        .cart-btn:hover { border-color: var(--gold-accent); }
        .cart-count-badge { background-color: var(--gold-accent); color: #0b0e14; font-size: 0.7rem; font-weight: 800; padding: 1px 6px; border-radius: 10px; min-width: 18px; text-align: center; }

        .container { max-width: 1400px; margin: 40px auto; padding: 0 20px; }
        .back-link { color: var(--text-muted); text-decoration: none; font-size: 0.9rem; display: inline-block; margin-bottom: 20px; }
        .back-link:hover { color: var(--gold-accent); }
        .not-found { text-align: center; padding: 80px 0; color: var(--text-muted); }
        .not-found a { color: var(--gold-accent); }

        .hero-grid { display: grid; grid-template-columns: 2fr 2fr 1fr; gap: 30px; margin-bottom: 50px; }
        .gallery-wrapper { display: flex; gap: 20px; }
        .thumbnails { display: flex; flex-direction: column; gap: 10px; }
        .thumb { width: 60px; height: 60px; background: #fff; border: 2px solid transparent; border-radius: 4px; padding: 5px; cursor: pointer; }
        .thumb:hover, .thumb.active { border-color: var(--gold-accent); }
        .thumb img { width: 100%; height: 100%; object-fit: contain; }
        .main-image { flex-grow: 1; background: #fff; border-radius: 8px; padding: 20px; display: flex; align-items: center; justify-content: center; }
        .main-image img { max-width: 100%; max-height: 400px; object-fit: contain; }

        .product-info h1 { font-size: 1.6rem; margin-bottom: 10px; line-height: 1.3; }
        .meta { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 10px; }
        .product-info p.blurb { color: var(--text-muted); line-height: 1.6; margin: 10px 0; font-size: 0.95rem; }
        .about-item h3 { font-size: 1.1rem; margin: 20px 0 10px 0; border-bottom: 1px solid var(--border-subtle); padding-bottom: 5px; }
        .features-list { list-style-type: disc; margin-left: 20px; line-height: 1.6; font-size: 0.9rem; }
        .features-list li { margin-bottom: 8px; }

        .action-box { background-color: var(--bg-panel); border: 1px solid var(--border-subtle); border-radius: 8px; padding: 20px; height: fit-content; }
        .price { font-size: 2.2rem; font-weight: 700; color: var(--gold-accent); margin-bottom: 12px; }
        .stock { color: #2ecc71; font-weight: 700; font-size: 0.95rem; margin-bottom: 6px; }
        .sold { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px; line-height: 1.5; }
        .quantity-wrapper { margin-bottom: 15px; }
        .quantity-wrapper label { display: block; font-size: 0.85rem; margin-bottom: 8px; color: var(--text-muted); }
        select { width: 100%; padding: 10px; background-color: var(--bg-main); color: var(--text-light); border: 1px solid #333; border-radius: 4px; font-size: 1rem; }
        .btn { width: 100%; padding: 14px; font-weight: 800; letter-spacing: 1px; border: none; border-radius: 20px; cursor: pointer; margin-bottom: 12px; font-size: 0.9rem; transition: all 0.2s; }
        .btn-cart { background-color: var(--gold-accent); color: var(--bg-main); }
        .btn-cart:hover { background-color: var(--gold-hover); }
        .btn-buy { background-color: var(--orange-btn); color: #fff; }
        .btn-buy:hover { background-color: var(--orange-hover); }

        .section-header { font-size: 1.4rem; color: var(--gold-accent); border-bottom: 2px solid var(--border-subtle); padding-bottom: 10px; margin: 50px 0 20px 0; text-transform: uppercase; letter-spacing: 1px; }
        .rich-content { background-color: var(--bg-card); padding: 30px; border-radius: 8px; line-height: 1.8; }
        .specs-table { width: 100%; border-collapse: collapse; background-color: var(--bg-card); border-radius: 8px; overflow: hidden; }
        .specs-table th, .specs-table td { padding: 15px; text-align: left; border-bottom: 1px solid var(--border-subtle); }
        .specs-table th { background-color: var(--bg-panel); color: var(--text-muted); width: 30%; font-weight: normal; }

        .related-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .related-card { background-color: var(--bg-card); border: 1px solid var(--border-subtle); padding: 15px; border-radius: 6px; transition: border-color 0.2s; text-decoration: none; color: inherit; display: block; }
        .related-card:hover { border-color: var(--gold-accent); }
        .related-img { background: #fff; height: 150px; display: flex; align-items: center; justify-content: center; border-radius: 4px; margin-bottom: 15px; padding: 10px; }
        .related-img img { max-width: 100%; max-height: 100%; }
        .related-title { font-size: 0.85rem; margin-bottom: 10px; height: 2.6em; overflow: hidden; }
        .related-price { color: var(--gold-accent); font-weight: 700; font-size: 1.1rem; }

        @media (max-width: 1024px) { .hero-grid { grid-template-columns: 1fr 1fr; } .action-box { grid-column: span 2; } }
        @media (max-width: 768px) { .hero-grid { grid-template-columns: 1fr; } .action-box { grid-column: span 1; } .gallery-wrapper { flex-direction: column-reverse; } .thumbnails { flex-direction: row; } }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">MONTGOMERY ARMS</a>
        <div class="header-right">
            <nav>
                <a href="index.html">CATALOG</a>
            </nav>
            <a href="cart.html" class="cart-btn" id="cart-button">
                <span>CART</span>
                <span id="cart-counter" class="cart-count-badge">0</span>
            </a>
        </div>
    </header>

    <main class="container">
        <a href="index.html" class="back-link">&larr; Back to Catalog</a>
        <div id="detail"></div>
    </main>

    <script src="products.js"></script>
    <script src="cart.js"></script>
    <script>
        const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const money = n => '$' + n.toFixed(2);
        const PLACEHOLDER = 'https://placehold.co/500x500/ffffff/121824?text=Montgomery+Arms';
        const imgOf = p => p.image || `images/${p.sku}/000001.jpg`;

        const sku = new URLSearchParams(location.search).get('sku');
        const p = products.find(x => x.sku === sku);
        const root = document.getElementById('detail');

        if (!p) {
            document.title = 'Product not found - Montgomery Arms';
            root.innerHTML = '<div class="not-found"><h2>We could not find that product.</h2><p style="margin-top:10px"><a href="index.html">Browse the catalog</a></p></div>';
        } else {
            document.title = p.title + ' - Montgomery Arms';
            const specs = Object.assign({}, p.specs || {}, { Category: p.category, SKU: p.sku });
            const related = products.filter(x => x.sku !== p.sku)
                .sort((a, b) => (b.category === p.category) - (a.category === p.category)).slice(0, 4);

            // Gallery: main image plus images/<sku>/000001-000004.jpg (thumbs that don't exist are removed)
            const gallery = [1, 2, 3, 4].map(n => `images/${p.sku}/00000${n}.jpg`);
            if (p.image) gallery.unshift(p.image);

            root.innerHTML = `
            <div class="hero-grid">
                <div class="gallery-wrapper">
                    <div class="thumbnails" id="thumbs">
                        ${gallery.map((src, i) => `<div class="thumb${i === 0 ? ' active' : ''}" data-src="${esc(src)}"><img src="${esc(src)}" alt="Photo ${i + 1}" onerror="this.parentNode.remove()"></div>`).join('')}
                    </div>
                    <div class="main-image"><img id="product-img" src="${esc(imgOf(p))}" alt="${esc(p.title)}" onerror="this.onerror=null;this.src='${PLACEHOLDER}'"></div>
                </div>

                <div class="product-info">
                    <h1>${esc(p.title)}</h1>
                    <p class="meta">SKU: ${esc(p.sku)} &nbsp;|&nbsp; ${esc(p.category)}</p>
                    ${p.blurb ? `<p class="blurb">${esc(p.blurb)}</p>` : ''}
                    ${p.features && p.features.length ? `<div class="about-item"><h3>About this item</h3><ul class="features-list">${p.features.map(f => `<li>${esc(f)}</li>`).join('')}</ul></div>` : ''}
                </div>

                <div class="action-box">
                    <div class="price">${money(p.price)}</div>
                    <div class="stock">In Stock</div>
                    <div class="sold">Ships from and sold by Montgomery Arms</div>
                    <div class="quantity-wrapper">
                        <label for="cart-quantity">Quantity:</label>
                        <select id="cart-quantity">${[1, 2, 3, 4, 5].map(n => `<option value="${n}">${n}</option>`).join('')}</select>
                    </div>
                    <button id="add-to-cart-btn" class="btn btn-cart">Add to Cart</button>
                    <button id="buy-now-btn" class="btn btn-buy">Buy Now</button>
                </div>
            </div>

            ${p.brandStory ? `<h2 class="section-header">From the Brand</h2><div class="rich-content"><p>${esc(p.brandStory)}</p></div>` : ''}

            <h2 class="section-header">Product Information</h2>
            <table class="specs-table"><tbody>
                ${Object.entries(specs).map(([k, v]) => `<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`).join('')}
            </tbody></table>

            <h2 class="section-header">More from Montgomery Arms</h2>
            <div class="related-grid">
                ${related.map(r => `
                    <a href="product-detail.html?sku=${encodeURIComponent(r.sku)}" class="related-card">
                        <div class="related-img"><img src="${esc(imgOf(r))}" alt="${esc(r.title)}" onerror="this.onerror=null;this.src='https://placehold.co/150x150/ffffff/121824?text=MA'"></div>
                        <div class="related-title">${esc(r.title)}</div>
                        <div class="related-price">${money(r.price)}</div>
                    </a>`).join('')}
            </div>`;

            document.getElementById('thumbs').addEventListener('click', e => {
                const t = e.target.closest('.thumb'); if (!t) return;
                document.querySelectorAll('.thumb').forEach(x => x.classList.toggle('active', x === t));
                document.getElementById('product-img').src = t.dataset.src;
            });
            const qty = () => parseInt(document.getElementById('cart-quantity').value, 10) || 1;
            document.getElementById('add-to-cart-btn').addEventListener('click', () => { Cart.add(p.sku, qty()); Cart.open(); });
            document.getElementById('buy-now-btn').addEventListener('click', () => { Cart.add(p.sku, qty()); location.href = 'checkout.html'; });
        }
    </script>
</body>
</html>
